name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check that every Python file has valid syntax
        run: python -m compileall -q .

      - name: Run the banking system tests
        working-directory: new_projects/banking_system
        run: python -m unittest discover -s tests
